databases:
  - name: pridally-db
    plan: free
    databaseName: pridal_db
    user: pridal

services:
  - type: web
    name: pridally-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pridally-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://chandraskn.github.io
